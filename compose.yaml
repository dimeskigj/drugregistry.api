services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drugregistry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the shell}
      POSTGRES_DB: ${POSTGRES_DB:-drugdb}
    restart: unless-stopped
    volumes:
      - ${POSTGRES_DATA_PATH:-../files/postgres-data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrations:
    build:
      context: .
      dockerfile: Dockerfile.Migrations
    command:
      - "--connection"
      - "Host=db;Port=5432;Database=${POSTGRES_DB:-drugdb};Username=${POSTGRES_USER:-drugregistry};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the shell}"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: "Host=db;Port=5432;Database=${POSTGRES_DB:-drugdb};Username=${POSTGRES_USER:-drugregistry};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the shell}"
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-}
      ForwardedHeaders__KnownProxies: ${FORWARDED_HEADERS_KNOWN_PROXIES:-}
      ForwardedHeaders__KnownNetworks: ${FORWARDED_HEADERS_KNOWN_NETWORKS:-}
      DataIngestion__RunBootstrapOnStartup: ${DATA_INGESTION_RUN_BOOTSTRAP_ON_STARTUP:-false}
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
